services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - /home/vbabadmin/lorawan-poc/configuration/chirpstack:/etc/chirpstack:ro
    depends_on:
      - lorawan-postgres
      - lorawan-mosquitto
      - lorawan-redis
    environment:
      - MQTT_BROKER_HOST=lorawan-mosquitto
      - REDIS_HOST=lorawan-redis
      - POSTGRESQL_HOST=lorawan-postgres
    ports:
      - "5017:8080"

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "5018:8090"
    depends_on:
      - chirpstack

  lorawan-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - /home/vbabadmin/lorawan-poc/configuration/postgresql/initdb:/docker-entrypoint-initdb.d:ro
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  lorawan-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  lorawan-mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /home/vbabadmin/lorawan-poc/configuration/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  observer-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: Hkby1983
      POSTGRES_DB: lorawan_observations
    volumes:
      - observerdata:/var/lib/postgresql/data
      - /home/vbabadmin/lorawan-poc/observer/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  observer:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir paho-mqtt psycopg2-binary cryptography openpyxl &&
             python -u observer.py"
    environment:
      MQTT_HOST: lorawan-mosquitto
      MQTT_PORT: "1883"
      DB_HOST: observer-postgres
      DB_NAME: lorawan_observations
      DB_USER: observer
      DB_PASSWORD: Hkby1983
    volumes:
        - /home/vbabadmin/lorawan-poc/observer:/app:ro
    depends_on:
      - lorawan-mosquitto
      - observer-postgres

  verifier:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install --no-cache-dir psycopg2-binary cryptography && python -u verify_worker.py"
    environment:
      DB_HOST: observer-postgres
      DB_NAME: lorawan_observations
      DB_USER: observer
      DB_PASSWORD: Hkby1983
    volumes:
      - /home/vbabadmin/lorawan-poc/observer:/app:ro
    depends_on:
      - observer-postgres
      
  chirpstack-ingestor:
    image: python:3.13-slim
    restart: unless-stopped
    working_dir: /app

    command: sh -c "pip install --no-cache-dir paho-mqtt psycopg2-binary && python -u ingestor.py"

    environment:
      MQTT_HOST: lorawan-mosquitto
      MQTT_PORT: "1883"

      DB_HOST: observer-postgres
      DB_NAME: lorawan_observations
      DB_USER: observer
      DB_PASSWORD: Hkby1983

    volumes:
      - /home/vbabadmin/lorawan-poc/ingestor:/app:ro

    depends_on:
      - lorawan-mosquitto
      - observer-postgres

volumes:
  postgresqldata:
  redisdata:
  observerdata:

networks:
  default:
    external: true
    name: vbab_internal_docker
